<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World FM – Welcome</title>
<meta name="description" content="World FM – Your world, your music. Made by Haiyash Prakash Gohel.">
<meta name="theme-color" content="#f6f9ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg1:#f6f9ff; --bg2:#dfeaff;
    --accent:#1e6bff; --accent2:#0a3fd1; --accent3:#38b6ff;
    --text:#0b1f44; --muted:#5b6f95; --line:rgba(30,107,255,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Poppins',sans-serif; color:var(--text);
    background:radial-gradient(1100px 760px at 15% 8%,#cfe0ff 0%,transparent 60%),
               radial-gradient(1000px 700px at 92% 92%,#bfe3ff 0%,transparent 55%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    overflow-x:hidden;overflow-y:auto;display:flex;padding:20px 0;
  }
  .welcome{margin:auto}
  .orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 14s ease-in-out infinite;pointer-events:none}
  .orb.o1{width:340px;height:340px;background:#6aa5ff;top:-90px;left:-90px}
  .orb.o2{width:300px;height:300px;background:#38b6ff;bottom:-90px;right:-60px;animation-delay:-5s}
  .orb.o3{width:220px;height:220px;background:#9cc4ff;top:55%;left:60%;animation-delay:-9s;opacity:.3}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}
  canvas#stars{position:fixed;inset:0;pointer-events:none;z-index:0}

  .welcome{
    position:relative;z-index:2;width:min(92vw,520px);padding:44px 32px 30px;text-align:center;
    background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);border-radius:28px;
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    box-shadow:0 30px 70px rgba(30,80,190,.18),0 2px 0 rgba(255,255,255,.9) inset;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}

  .live{
    position:absolute;top:18px;right:20px;display:flex;align-items:center;gap:7px;
    font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--accent2);
    background:rgba(30,107,255,.10);border:1px solid rgba(30,107,255,.3);padding:5px 11px;border-radius:999px;
  }
  .live i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,107,255,.6)}70%{box-shadow:0 0 0 9px rgba(30,107,255,0)}100%{box-shadow:0 0 0 0 rgba(30,107,255,0)}}

  .logo{
    width:116px;height:116px;margin:6px auto 22px;position:relative;display:grid;place-items:center;border-radius:50%;
    background:conic-gradient(from 0deg,var(--accent2),var(--accent3),#ffffff,var(--accent),var(--accent2));
    animation:spin 9s linear infinite;box-shadow:0 12px 40px rgba(30,107,255,.4);
  }
  .logo::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
  .logo svg{position:relative;width:54px;height:54px;animation:spin 9s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}

  h1{
    font-size:clamp(30px,8.5vw,50px);white-space:nowrap;font-weight:800;letter-spacing:1px;line-height:1.05;
    background:linear-gradient(90deg,#0b1f44,#0a3fd1 55%,#1e6bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1 span{color:transparent;background:linear-gradient(90deg,var(--accent),var(--accent3));-webkit-background-clip:text;background-clip:text}
  .tag{margin-top:8px;font-family:'Playfair Display',serif;font-style:italic;font-size:17px;color:var(--muted)}

  .eq{display:flex;justify-content:center;align-items:flex-end;gap:5px;height:46px;margin:24px 0 8px}
  .eq b{width:6px;border-radius:4px;background:linear-gradient(to top,var(--accent2),var(--accent3));animation:bar 1.1s ease-in-out infinite;height:10px}
  .eq b:nth-child(2){animation-delay:-.9s}.eq b:nth-child(3){animation-delay:-.7s}
  .eq b:nth-child(4){animation-delay:-.5s}.eq b:nth-child(5){animation-delay:-.3s}
  .eq b:nth-child(6){animation-delay:-.8s}.eq b:nth-child(7){animation-delay:-.4s}
  .eq b:nth-child(8){animation-delay:-.6s}.eq b:nth-child(9){animation-delay:-.2s}
  .eq b:nth-child(10){animation-delay:-1s}.eq b:nth-child(11){animation-delay:-.55s}
  @keyframes bar{0%,100%{height:8px}50%{height:44px}}

  .listen{margin:14px 0 22px;font-size:15px;color:#2a3f6b;font-weight:400;letter-spacing:.4px}
  .listen strong{color:var(--text);font-weight:600;font-size:18px}
  .listen .sub{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--muted)}

  .btn{
    position:relative;display:inline-flex;align-items:center;gap:12px;padding:16px 40px;border:0;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:17px;font-weight:600;color:#fff;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    box-shadow:0 12px 30px rgba(30,107,255,.45);transition:transform .25s,box-shadow .25s;overflow:hidden;
  }
  .btn::after{content:"";position:absolute;top:0;left:-120%;width:80%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
  @keyframes shine{0%{left:-120%}55%,100%{left:140%}}
  .btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 18px 40px rgba(10,63,209,.5)}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid var(--accent3);outline-offset:4px}
  .btn svg{width:20px;height:20px;transition:transform .25s}
  .btn:hover svg{transform:translateX(5px)}

  .features{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
  .feat{padding:14px 10px;border-radius:16px;text-align:center;background:rgba(255,255,255,.8);border:1px solid var(--line);
    box-shadow:0 6px 18px rgba(30,80,190,.07);transition:transform .25s,border-color .25s,box-shadow .25s}
  .feat:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 26px rgba(30,107,255,.18)}
  .feat span{font-size:22px;display:block;margin-bottom:4px}
  .feat b{display:block;font-size:13px;font-weight:600;color:var(--text)}
  .feat small{font-size:11px;color:var(--muted)}
  .brand{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;font-weight:600;letter-spacing:1.5px;
    background:linear-gradient(90deg,var(--accent2),var(--accent),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}

  .credit{margin:20px auto 0;padding:12px 22px;display:inline-block;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.75);
    font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
  .credit b{display:block;margin-top:4px;font-size:20px;font-weight:700;letter-spacing:.8px;text-transform:none;
    background:linear-gradient(90deg,#0b1f44,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}

  .fade{position:fixed;inset:0;background:var(--bg1);opacity:0;pointer-events:none;z-index:99;transition:opacity .6s}
  .fade.on{opacity:1;pointer-events:all}
  .fade .ring{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border:4px solid rgba(30,107,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:420px){.welcome{padding:40px 20px 24px}.btn{padding:15px 32px}}
  .langs{position:absolute;top:16px;left:18px;display:flex;gap:5px}
  .langs button{border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--accent2);font:600 11px Poppins,sans-serif;padding:5px 9px;border-radius:999px;cursor:pointer}
  .langs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>

    const btn  = document.getElementById('startBtn');
    const fade = document.getElementById('fade');
    let started = false, stopStars = false;

    function b64ToUtf8(b){
      const bin = atob(b), bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }
    function go(){
      if(started) return;
      started = true;
      fade.classList.add('on');
      setTimeout(()=>{ stopStars = true; loadRadioApp(); }, 650);
    }
    async function loadRadioApp(){
      const doc = new DOMParser().parseFromString(b64ToUtf8(RADIO_APP_B64), 'text/html');
      [...document.head.children].forEach(e=>{ if(!(e.tagName==='LINK' && /manifest|icon/.test(e.rel))) e.remove(); });
      document.body.innerHTML = '';
      document.body.removeAttribute('style');
      document.body.removeAttribute('class');
      document.title = doc.title || 'World FM Radio';
      const scripts = [];
      doc.head.querySelectorAll('*').forEach(el=>{
        if(el.tagName === 'SCRIPT') scripts.push(el);
        else document.head.appendChild(document.importNode(el, true));
      });
      doc.body.querySelectorAll('script').forEach(el=>{ scripts.push(el); el.remove(); });
      document.body.innerHTML = doc.body.innerHTML;
      try{ localStorage.getItem('x'); }catch(e){
        const mem={};
        Object.defineProperty(window,'localStorage',{value:{
          getItem:k=>k in mem?mem[k]:null,
          setItem:(k,v)=>{mem[k]=String(v)},
          removeItem:k=>{delete mem[k]}
        }});
      }
      for(const old of scripts){
        await new Promise(resolve=>{
          const s = document.createElement('script');
          if(old.src){ s.src = old.src; s.onload = s.onerror = ()=>resolve(); document.body.appendChild(s); }
          else{ s.textContent = old.textContent; document.body.appendChild(s); resolve(); }
        });
      }
    }

    let wl='en';try{wl=localStorage.getItem('wf_lang')||'en'}catch(e){}
    function wApply(){document.documentElement.lang=wl;

      document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===wl))}

/* starry background */
    const c = document.getElementById('stars'), x = c.getContext('2d');
    let W,H,stars=[];
    function resize(){
      W=c.width=innerWidth; H=c.height=innerHeight;
      stars=Array.from({length:Math.min(120,Math.floor(W*H/12000))},()=>({
        x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,
        s:Math.random()*.35+.05,a:Math.random()
      }));
    }
    function draw(){
      if(stopStars) return;
      x.clearRect(0,0,W,H);
      for(const s of stars){
        s.y-=s.s; s.a+=.02;
        if(s.y<0){s.y=H;s.x=Math.random()*W}
        x.globalAlpha=.15+Math.abs(Math.sin(s.a))*.4;
        x.fillStyle='#4a8dff';
        x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();
      }
      requestAnimationFrame(draw);
    }
    addEventListener('resize',resize);resize();draw();
  </script>
